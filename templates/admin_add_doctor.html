{% extends "base_admin.html" %}

{% block title %}Add Doctor{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Add New Doctor</h2>

  <form action="{{ url_for('admin_add_doctor') }}" method="POST">
    <!-- Personal Details -->
    <h5 class="mb-3">Personal Details</h5>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">First Name *</label>
        <input type="text" name="fname" class="form-control" placeholder="Enter first name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Last Name *</label>
        <input type="text" name="lname" class="form-control" placeholder="Enter last name" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone Number *</label>
        <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-12">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" placeholder="Enter address">
      </div>
    </div>

    <!-- Login Details -->
    <h5 class="mb-3">Login Credentials</h5>
    <div class="row mb-4">
      <div class="col-md-6">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Password *</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
    </div>

    <!-- Professional Details -->
    <h5 class="mb-3">Professional Details</h5>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Qualification *</label>
        <input type="text" name="qualification" class="form-control" placeholder="e.g., MBBS, MD" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Experience (Years) *</label>
        <input type="number" name="experience_years" class="form-control" min="0" placeholder="Enter experience" required>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label class="form-label">Consultation Fee (₹) *</label>
        <input type="number" name="consultation_fee" class="form-control" min="0" step="0.01" placeholder="Enter fee" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Bio (optional)</label>
        <textarea name="bio" class="form-control" placeholder="Short doctor introduction" rows="2"></textarea>
      </div>
    </div>

    <!-- Department / Specialization -->
    <label class="form-label">Select Specialization *</label>
    <select name="department_id" class="form-select mb-4" required>
      <option value="" selected disabled>Select specialization</option>
      {% for dept in departments %}
      <option value="{{ dept.department_id }}">{{ dept.department_name }}</option>
      {% endfor %}
    </select>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary px-4">Add Doctor</button>
  </form>
</div>
{% endblock %}
