<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%} Hospital Management System {%endblock%}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="PBnav">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <!-- Left side: logo + hospital name -->
            <div class="d-flex align-items-center">
            <img src="/static/images/Logo.png" alt="Logo" height="45" class="me-2">
            <a class="navbar-brand mb-0 h1 text-white" href="#">Hospital</a>
            </div>

            <!-- Toggle button for mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Right side: search + logout -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
            <form class="d-flex me-3" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
            <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
        </div>
        </nav>
    </div>
    <div id="PBmain">
        <div id="PBleft">            
            <div id="PBleftlink">
                <a href="{{ url_for('doctor_dashboard') }}" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="{{url_for('doctor_appointment')}}" class="sidebar-link"><i class="fa-regular fa-calendar-check"></i> Appointments</a>
                <a href="{{url_for('doctor_patient')}}" class="sidebar-link"><i class="fa-solid fa-user-doctor"></i> Patients</a>
                <a href="{{url_for('doctor_profile')}}" class="sidebar-link"><i class="fa-solid fa-user"></i> Profile</a>
            </div>
          
        </div>
        <div id="PBright">
            {%block content%} {%endblock%}
        </div>
    </div>
</body>
</html>
